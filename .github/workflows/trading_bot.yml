name: APEX TRADER

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: apex-trader
  cancel-in-progress: false

jobs:
  trade:
    name: "Binance Trading Cycle"
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      PYTHONPATH: ${{ github.workspace }}
      TRADING_EXCHANGES: binance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Create logs directory
        run: mkdir -p logs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --disable-pip-version-check \
            --upgrade-strategy=only-if-needed \
            -r requirements.txt
          python -m pip check

      - name: Validate project
        env:
          TRADING_EXCHANGES: binance
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          BINANCE_TESTNET: "true"
        run: |
          test -f bot/__init__.py
          test -f bot/config.py
          test -f bot/main.py
          test -f bot/core/exchange.py
          test -f bot/data/market_data.py
          test -f requirements.txt

          python -m compileall -q bot tests

          python -c "from bot.config import config; print('enabled exchanges:', config.exchange.enabled_exchanges())"
          python -c "from bot.core.exchange import ExchangeManager; print('ExchangeManager import OK')"
          python -c "from bot.data.market_data import MarketDataManager; print('MarketDataManager import OK')"

      - name: Run tests
        env:
          TRADING_EXCHANGES: binance
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          BINANCE_TESTNET: "true"

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          MAX_DAILY_LOSS_PCT: ${{ secrets.MAX_DAILY_LOSS_PCT }}
          MAX_LEVERAGE: ${{ secrets.MAX_LEVERAGE }}
          COMPOUNDING_RATE: ${{ secrets.COMPOUNDING_RATE }}
        run: |
          python -m pytest tests/ -x -q --timeout=30 \
            -k "not test_real_balance and not test_real_ohlcv_data and not test_signal_engine_no_mock and not test_indicators_output_validity and not test_all_prices_from_api and not test_real_ticker"

      - name: Run Binance bot
        env:
          TRADING_EXCHANGES: binance
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          BINANCE_TESTNET: "true"

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
          INITIAL_BALANCE: ${{ secrets.INITIAL_BALANCE }}
          MAX_DAILY_LOSS_PCT: ${{ secrets.MAX_DAILY_LOSS_PCT }}
          MAX_LEVERAGE: ${{ secrets.MAX_LEVERAGE }}
          ACTIVE_MODE: ${{ secrets.ACTIVE_MODE }}
          COMPOUNDING_RATE: ${{ secrets.COMPOUNDING_RATE }}
        run: python -m bot.main

      - name: Upload logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: error-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: warn
