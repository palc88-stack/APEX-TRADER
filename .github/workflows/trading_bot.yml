# ======================================
# APEX TRADER - GitHub Actions (محدّث)
# ======================================

name: APEX TRADER

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  trade:
    name: '🤖 دورة التداول'
    runs-on: ubuntu-latest
    timeout-minutes: 4

    concurrency:
      group: apex-trader
      cancel-in-progress: false

    steps:
      - name: '📥 جلب الكود'
        uses: actions/checkout@v4

      - name: '🐍 إعداد Python 3.11'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: '📦 تثبيت المكتبات'
        run: |
          pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet

      - name: '📁 إعداد المجلدات'
        run: |
          mkdir -p logs

      - name: '🧪 اختبارات سريعة'
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          BINANCE_TESTNET: ${{ secrets.BINANCE_TESTNET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
          INITIAL_BALANCE: ${{ secrets.INITIAL_BALANCE }}
          MAX_DAILY_LOSS_PCT: ${{ secrets.MAX_DAILY_LOSS_PCT }}
          MAX_LEVERAGE: ${{ secrets.MAX_LEVERAGE }}
          ACTIVE_MODE: ${{ secrets.ACTIVE_MODE }}
          COMPOUNDING_RATE: ${{ secrets.COMPOUNDING_RATE }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_SECRET_KEY: ${{ secrets.BYBIT_SECRET_KEY }}
          BYBIT_TESTNET: ${{ secrets.BYBIT_TESTNET }}
        run: |
          python -m pytest tests/ -x -q \
            --timeout=30 \
            -k "not test_real_balance" \
            2>/dev/null || true

      - name: '🚀 تشغيل البوت'
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          BINANCE_TESTNET: ${{ secrets.BINANCE_TESTNET }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_SECRET_KEY: ${{ secrets.BYBIT_SECRET_KEY }}
          BYBIT_TESTNET: ${{ secrets.BYBIT_TESTNET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
          INITIAL_BALANCE: ${{ secrets.INITIAL_BALANCE }}
          MAX_DAILY_LOSS_PCT: ${{ secrets.MAX_DAILY_LOSS_PCT }}
          MAX_LEVERAGE: ${{ secrets.MAX_LEVERAGE }}
          ACTIVE_MODE: ${{ secrets.ACTIVE_MODE }}
          COMPOUNDING_RATE: ${{ secrets.COMPOUNDING_RATE }}
        run: |
          echo "🚀 APEX TRADER يبدأ $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          python -m bot.main
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ البوت انتهى بخطأ: $EXIT_CODE"
            exit $EXIT_CODE
          fi
          echo "✅ اكتملت الدورة بنجاح"

      - name: '📋 رفع السجلات عند الفشل'
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs-${{ github.run_id }}
          path: logs/
          retention-days: 3
