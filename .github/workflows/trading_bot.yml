# ======================================
# APEX TRADER - GitHub Actions
# ======================================

name: APEX TRADER

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trade:
    name: "🤖 دورة التداول"
    runs-on: ubuntu-latest
    timeout-minutes: 4

    env:
      PYTHONPATH: ${{ github.workspace }}

    concurrency:
      group: apex-trader
      cancel-in-progress: false

    steps:
      - name: "📥 جلب الكود"
        uses: actions/checkout@v4

      - name: "🐍 إعداد Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: "📁 إعداد المجلدات"
        run: mkdir -p logs

      - name: "📦 تثبيت المكتبات والتحقق من الاعتماديات"
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check --upgrade-strategy=only-if-needed -r requirements.txt
          python -m pip check
          python -m pip show ccxt
          python -c "import ccxt; print('ccxt OK:', ccxt.__version__)"
          python -c "import ccxt.async_support as ccxt_async; print('ccxt.async_support OK')"

      - name: "🔍 التحقق من المشروع قبل الاختبار"
        run: |
          pwd
          echo "PYTHONPATH=$PYTHONPATH"
          test -f bot/__init__.py
          test -f bot/core/exchange.py
          test -f requirements.txt
          python -c "import bot; print('bot imported OK')"
          python -c "from bot.core.fee_calculator import FeeCalculator; print('FeeCalculator imported OK')"
          python -c "from bot.core.exchange import ExchangeManager; print('ExchangeManager imported OK')"

      - name: "🔎 فحص Python والاختبارات السريعة"
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          BINANCE_TESTNET: ${{ secrets.BINANCE_TESTNET }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_SECRET_KEY: ${{ secrets.BYBIT_SECRET_KEY }}
          BYBIT_TESTNET: ${{ secrets.BYBIT_TESTNET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
          INITIAL_BALANCE: ${{ secrets.INITIAL_BALANCE }}
          MAX_DAILY_LOSS_PCT: ${{ secrets.MAX_DAILY_LOSS_PCT }}
          MAX_LEVERAGE: ${{ secrets.MAX_LEVERAGE }}
          ACTIVE_MODE: ${{ secrets.ACTIVE_MODE }}
          COMPOUNDING_RATE: ${{ secrets.COMPOUNDING_RATE }}
        run: |
          python -m compileall -q bot tests
          python -m pytest tests/ -x -q --timeout=30 \
            -k "not test_real_balance and not test_real_ohlcv_data and not test_signal_engine_no_mock and not test_indicators_output_validity and not test_all_prices_from_api and not test_real_ticker and not test_indicators_with_real_data"

      - name: "🚀 تشغيل البوت"
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
          BINANCE_TESTNET: ${{ secrets.BINANCE_TESTNET }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_SECRET_KEY: ${{ secrets.BYBIT_SECRET_KEY }}
          BYBIT_TESTNET: ${{ secrets.BYBIT_TESTNET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
          INITIAL_BALANCE: ${{ secrets.INITIAL_BALANCE }}
          MAX_DAILY_LOSS_PCT: ${{ secrets.MAX_DAILY_LOSS_PCT }}
          MAX_LEVERAGE: ${{ secrets.MAX_LEVERAGE }}
          ACTIVE_MODE: ${{ secrets.ACTIVE_MODE }}
          COMPOUNDING_RATE: ${{ secrets.COMPOUNDING_RATE }}
        run: python -m bot.main

      - name: "📋 رفع السجلات عند الفشل"
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: error-logs-${{ github.run_id }}
          path: logs/
          retention-days: 3
          if-no-files-found: warn
