name: APEX Trader Verification

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: apex-verification-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      ENVIRONMENT: testnet
      BINANCE_TESTNET: "true"
      ALLOW_LIVE_TRADING: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q bot tests
      - name: Unit tests
        run: python -m pytest -q tests/test_exchange_config.py tests/test_full_system.py --timeout=30
      - name: Verify Worker syntax
        run: node --check src/worker.js
      - name: Build dashboard
        working-directory: web
        run: npm ci && npm run build
      - name: Assert safety gates
        run: |
          python - <<'PY'
          from pathlib import Path
          exchange = Path('bot/core/exchange.py').read_text()
          worker = Path('src/worker.js').read_text()
          workflow = Path('.github/workflows/binance.yml').read_text()
          schema = Path('database/schema.sql').read_text()
          assert 'ALLOW_LIVE_TRADING' in exchange
          assert 'reduce_only_close' in exchange
          forbidden_key = 'SUPABASE_' + 'SERVICE_KEY'
          assert forbidden_key not in worker
          assert '\n  schedule:' not in workflow
          assert 'ENABLE ROW LEVEL SECURITY' in schema
          print('safety gates verified')
          PY
