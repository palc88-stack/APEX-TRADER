name: APEX Daily Testnet Checks

on:
  # Run once every 24 hours at 00:00 UTC; also available on demand.
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: apex-daily-testnet-check
  cancel-in-progress: false

jobs:
  daily-check:
    name: Daily safety, strategy and consistency checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      ENVIRONMENT: testnet
      PRIMARY_EXCHANGE: binance
      BINANCE_TESTNET: "true"
      ALLOW_LIVE_TRADING: "false"
      TRADING_EXECUTION_ENABLED: "false"
      ALLOW_NEW_ENTRIES: "false"
      AUTO_RECONCILE_CLOSE_ENABLED: "false"
      AUTO_RECONCILE_CLOSE_LIVE: "false"
      UNIVERSE_REFRESH_ONLY: "false"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_WRITE_KEY: ${{ secrets.SUPABASE_WRITE_KEY }}
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate read-only Testnet gates and secrets
        shell: bash
        run: |
          test "$ENVIRONMENT" = "testnet"
          test "$PRIMARY_EXCHANGE" = "binance"
          test "$BINANCE_TESTNET" = "true"
          test "$ALLOW_LIVE_TRADING" = "false"
          test "$TRADING_EXECUTION_ENABLED" = "false"
          test "$ALLOW_NEW_ENTRIES" = "false"
          test "$AUTO_RECONCILE_CLOSE_ENABLED" = "false"
          test "$AUTO_RECONCILE_CLOSE_LIVE" = "false"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_WRITE_KEY"
          test -n "$BINANCE_API_KEY"
          test -n "$BINANCE_SECRET_KEY"
          echo "Daily checks are read-only; no order path is enabled."

      - name: Compile Python and run all tests
        run: |
          python -m compileall -q bot tests scripts
          python -m pytest -q --timeout=30

      - name: Verify Cloudflare Worker syntax
        run: node --check src/worker.js

      - name: Build dashboard
        working-directory: web
        run: npm ci && npm run build

      - name: Verify Binance Testnet and Supabase consistency (read-only)
        run: |
          mkdir -p artifacts
          python scripts/verify_testnet_consistency.py \
            --output "artifacts/daily-consistency-${GITHUB_RUN_ID}.json"

      - name: Upload daily consistency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-testnet-consistency-${{ github.run_id }}
          path: artifacts/daily-consistency-${{ github.run_id }}.json
          if-no-files-found: warn
