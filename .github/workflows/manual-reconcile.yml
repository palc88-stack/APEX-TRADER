name: Manual Testnet Reconciliation

on:
  workflow_dispatch:
    inputs:
      trade_id:
        description: "Trade/order ID to reconcile"
        required: true
        default: "317021174"
        type: string
      symbol:
        description: "CCXT Binance USD-M symbol"
        required: true
        default: "RDNT/USDT:USDT"
        type: string

permissions:
  contents: read

concurrency:
  group: apex-manual-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RECONCILE_TRADE_ID: ${{ inputs.trade_id }}
      RECONCILE_SYMBOL: ${{ inputs.symbol }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_WRITE_KEY: ${{ secrets.SUPABASE_WRITE_KEY }}
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate required secrets
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_WRITE_KEY"
          test -n "$BINANCE_API_KEY"
          test -n "$BINANCE_SECRET_KEY"
      - name: Reconcile closed Testnet position
        run: python scripts/reconcile_closed_trade.py
