name: APEX Trader Run

on:
  # Manual reconciliation fallback; Botkeep owns continuous execution.
  workflow_dispatch: {}

concurrency:
  group: apex-run
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      PYTHONPATH: ${{ github.workspace }}
      ENVIRONMENT: testnet
      BINANCE_TESTNET: "true"
      ALLOW_LIVE_TRADING: "false"
      # Manual fallback may reconcile Testnet positions, but never open entries.
      TRADING_EXECUTION_ENABLED: "true"
      ALLOW_NEW_ENTRIES: "false"
      SHADOW_MODE: "true"
      AUTO_RECONCILE_CLOSE_ENABLED: "true"
      AUTO_RECONCILE_CLOSE_LIVE: "false"
      MAX_LEVERAGE: "5"
      MAX_RISK_PER_TRADE_PCT: "1.0"
      MAX_RISK_PER_TRADE_USD: "10.0"
      ATR_PERIOD: "14"
      ATR_STOP_MULTIPLIER: "2.0"
      SUBTYPE_REPORT_BATCH_SIZE: "10"
      APEX_RUN_CYCLES: "1"
      # The bot acquires this lease before initialization and releases it on exit.
      APEX_LEASE_NAME: apex-trading-execution
      APEX_LEASE_OWNER: github:reconcile:${{ github.run_id }}
      APEX_LEASE_TTL_SECONDS: "300"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_WRITE_KEY: ${{ secrets.SUPABASE_WRITE_KEY }}
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      BINANCE_SECRET_KEY: ${{ secrets.BINANCE_SECRET_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run one trading cycle
        run: python -m bot.main
