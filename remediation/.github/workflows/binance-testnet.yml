name: APEX Trader Testnet Verification

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: apex-testnet-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}
      ENVIRONMENT: testnet
      BINANCE_TESTNET: "true"
      ALLOW_LIVE_TRADING: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q bot tests
      - name: Unit tests
        run: python -m pytest -q tests/test_exchange_config.py tests/test_full_system.py --timeout=30
      - name: Verify Worker syntax
        run: node --check src/worker.js
      - name: Build dashboard
        working-directory: web
        run: npm ci && npm run build
      - name: Assert no live gate bypass
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('bot/core/exchange.py').read_text()
          config = Path('bot/config.py').read_text()
          assert 'ALLOW_LIVE_TRADING' in source or 'ALLOW_LIVE_TRADING' in config
          assert 'reduceOnly' in source
          print('static safety gate check complete')
          PY
